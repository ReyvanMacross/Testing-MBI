name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - dinsos
      - disnaker

permissions:
  contents: read

jobs:
  static-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run test-migration-chain
      - run: npm run scan:pii
      - run: npm run scan:secrets
      - run: npm run audit:dinsos-api-guards
      - run: npm run audit:disnaker-api-guards
