name: Verify

on:
  workflow_dispatch:
    inputs:
      run_hosted_staging:
        description: Jalankan validasi hosted staging
        required: true
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
      - diskominfo
      - dinsos
      - disnaker
      - feat/diskop-ukm-mvp
      - feat/disdik-mvp
      - feat/kecamatan-mvp
      - feat/dp3a-mvp
      - feat/disdagin-mvp
      - feat/dkpp-mvp
      - feat/disbudpar-mvp
      - feat/cipta-bintar-mvp
      - feat/bapperida-mvp
      - integration/**

permissions:
  contents: read

jobs:
  static-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-placeholder
      SUPABASE_SECRET_KEY: ci
      APP_ORIGIN: http://localhost:3000
      DISNAKER_PREVIEW_MODE: "false"
      DISKOP_PREVIEW_MODE: "false"
      DISDIK_PREVIEW_MODE: "false"
      DP3A_PREVIEW_MODE: "false"
      DISDAGIN_PREVIEW_MODE: "false"
      DKPP_PREVIEW_MODE: "false"
      DISBUDPAR_PREVIEW_MODE: "false"
      CIPTA_BINTAR_PREVIEW_MODE: "false"
      BAPPERIDA_PREVIEW_MODE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run test-migration-chain
      - run: npm run audit:integration
      - run: npm run test:disdik-contract
      - run: npm run test:kecamatan-contract
      - run: npm run test:dp3a-contract
      - run: npm run test:disdagin-contract
      - run: npm run test:dkpp-contract
      - run: npm run test:disbudpar-contract
      - run: npm run test:cipta-bintar-contract
      - run: npm run test:bapperida-contract
      - run: npm run scan:pii
      - run: npm run scan:secrets
      - run: npm run audit:dinsos-api-guards
      - run: npm run audit:disnaker-api-guards
      - run: npm run audit:diskop-api-guards
      - run: npm run audit:disdik-api-guards
      - run: npm run audit:kecamatan-api-guards
      - run: npm run audit:dp3a-api-guards
      - run: npm run audit:disdagin-api-guards
      - run: npm run audit:dkpp-api-guards
      - run: npm run audit:disbudpar-api-guards
      - run: npm run audit:cipta-bintar-api-guards
      - run: npm run audit:bapperida-api-guards

  hosted-staging-verification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_staging }}
    needs: static-verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      APP_ORIGIN: http://localhost:3000
      DISNAKER_PREVIEW_MODE: "false"
      DISKOP_PREVIEW_MODE: "false"
      DISDIK_PREVIEW_MODE: "false"
      DP3A_PREVIEW_MODE: "false"
      DISDAGIN_PREVIEW_MODE: "false"
      DKPP_PREVIEW_MODE: "false"
      DISBUDPAR_PREVIEW_MODE: "false"
      CIPTA_BINTAR_PREVIEW_MODE: "false"
      BAPPERIDA_PREVIEW_MODE: "false"
      SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
      SUPABASE_TEST_ADMIN_PASSWORD: ${{ secrets.SUPABASE_TEST_ADMIN_PASSWORD }}
      SUPABASE_TEST_FIELD_PASSWORD: ${{ secrets.SUPABASE_TEST_FIELD_PASSWORD }}
      SUPABASE_TEST_VILLAGE_PASSWORD: ${{ secrets.SUPABASE_TEST_VILLAGE_PASSWORD }}
      E2E_ADMIN_IDENTIFIER: ${{ secrets.E2E_ADMIN_IDENTIFIER }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_DINSOS_IDENTIFIER: ${{ secrets.E2E_DINSOS_IDENTIFIER }}
      E2E_DINSOS_PASSWORD: ${{ secrets.E2E_DINSOS_PASSWORD }}
      E2E_DISNAKER_IDENTIFIER: ${{ secrets.E2E_DISNAKER_IDENTIFIER }}
      E2E_DISNAKER_PASSWORD: ${{ secrets.E2E_DISNAKER_PASSWORD }}
      E2E_DISKOP_IDENTIFIER: ${{ secrets.E2E_DISKOP_IDENTIFIER }}
      E2E_DISKOP_PASSWORD: ${{ secrets.E2E_DISKOP_PASSWORD }}
      E2E_DISDIK_IDENTIFIER: ${{ secrets.E2E_DISDIK_IDENTIFIER }}
      E2E_DISDIK_PASSWORD: ${{ secrets.E2E_DISDIK_PASSWORD }}
      E2E_KECAMATAN_IDENTIFIER: ${{ secrets.E2E_KECAMATAN_IDENTIFIER }}
      E2E_KECAMATAN_PASSWORD: ${{ secrets.E2E_KECAMATAN_PASSWORD }}
      E2E_DP3A_IDENTIFIER: ${{ secrets.E2E_DP3A_IDENTIFIER }}
      E2E_DP3A_PASSWORD: ${{ secrets.E2E_DP3A_PASSWORD }}
      E2E_DISDAGIN_IDENTIFIER: ${{ secrets.E2E_DISDAGIN_IDENTIFIER }}
      E2E_DISDAGIN_PASSWORD: ${{ secrets.E2E_DISDAGIN_PASSWORD }}
      E2E_DKPP_IDENTIFIER: ${{ secrets.E2E_DKPP_IDENTIFIER }}
      E2E_DKPP_PASSWORD: ${{ secrets.E2E_DKPP_PASSWORD }}
      E2E_DISBUDPAR_IDENTIFIER: ${{ secrets.E2E_DISBUDPAR_IDENTIFIER }}
      E2E_DISBUDPAR_PASSWORD: ${{ secrets.E2E_DISBUDPAR_PASSWORD }}
      E2E_CIPTA_BINTAR_IDENTIFIER: ${{ secrets.E2E_CIPTA_BINTAR_IDENTIFIER }}
      E2E_CIPTA_BINTAR_PASSWORD: ${{ secrets.E2E_CIPTA_BINTAR_PASSWORD }}
      E2E_BAPPERIDA_IDENTIFIER: ${{ secrets.E2E_BAPPERIDA_IDENTIFIER }}
      E2E_BAPPERIDA_PASSWORD: ${{ secrets.E2E_BAPPERIDA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:integration-env
      - run: npm run onboard:integration-actors
      - run: npm run verify:integration-hosted
